[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-agent-sakura"
version = "0.1.0"
description = "A multi-agent robo-advisor research and implementation workspace."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
market-data-us = [
    "yfinance>=0.2",
]
market-data-cn = [
    "akshare>=1.14",
    "tushare>=1.4",
]
market-data = [
    "yfinance>=0.2",
    "akshare>=1.14",
    "tushare>=1.4",
]
technical-analysis = [
    "pandas-ta>=0.3.14b0",
]
technical-analysis-talib = [
    "TA-Lib>=0.4",
]
rag = [
    "chromadb>=0.5",
    "langchain>=0.2",
    "langchain-chroma>=0.1",
    "langchain-community>=0.2",
    "langchain-openai>=0.1",
    "langchain-text-splitters>=0.2",
    "pypdf>=4.0",
    "rank-bm25>=0.2",
]
agents = [
    "langchain-core>=0.2",
    "langgraph>=0.2",
    "pydantic>=2",
]
tools = [
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
]
portfolio = [
    "PyPortfolioOpt>=1.5",
    "yfinance>=0.2",
]
dashboard = [
    "plotly>=5.0",
    "reportlab>=4.0",
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
where = ["src"]
